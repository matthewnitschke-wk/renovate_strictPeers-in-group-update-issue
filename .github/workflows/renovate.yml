name: Renovate

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json

      - run: pnpx renovate "matthewnitschke-wk/renovate_strictPeers-in-group-update-issue"
        env:
          LOG_LEVEL: debug
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
